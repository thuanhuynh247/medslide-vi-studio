name: Build Windows (.exe)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: medslide-vi-studio-windows
          path: release/*.exe
      # Tự phát hành: mỗi lần lên main, tạo/cập nhật Release v<version> theo package.json
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: MedSlide VI Studio v${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            Studio làm slide Y khoa bằng AI cho Windows 10/11 (64-bit).
            - **MedSlide-VI-Studio-Setup-x64.exe**: bộ cài đặt (có lối tắt Desktop, gỡ cài đặt được)
            - **MedSlide-VI-Studio-Portable-x64.exe**: bản chạy ngay, không cần cài
            Windows có thể cảnh báo SmartScreen vì ứng dụng chưa ký số: bấm "More info" → "Run anyway".
            Hướng dẫn: https://github.com/thuanhuynh247/medslide-vi-studio#readme
          files: release/*.exe
